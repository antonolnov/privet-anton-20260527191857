<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Привет, Антон</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0815;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 109, 194, 0.38), transparent 34%),
        radial-gradient(circle at 80% 20%, rgba(88, 199, 255, 0.36), transparent 31%),
        radial-gradient(circle at 55% 88%, rgba(147, 94, 255, 0.42), transparent 38%),
        linear-gradient(135deg, #0a0815, #15122b 48%, #070b18);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      background:
        conic-gradient(from 120deg, rgba(255, 103, 164, 0.22), rgba(96, 214, 255, 0.2), rgba(164, 116, 255, 0.24), rgba(255, 103, 164, 0.22));
      filter: blur(70px) saturate(130%);
      animation: drift 18s ease-in-out infinite alternate;
      opacity: 0.9;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 900px;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(18px);
      opacity: 0.78;
      mix-blend-mode: screen;
      box-shadow: 0 35px 120px rgba(255, 255, 255, 0.18);
      animation: float 14s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 34vmax;
      height: 34vmax;
      left: -8vmax;
      top: 11vh;
      background: radial-gradient(circle at 35% 30%, #ffe1f1, #ff54ba 38%, rgba(255, 84, 186, 0) 72%);
      transform: translateZ(-120px);
    }

    .orb.two {
      width: 29vmax;
      height: 29vmax;
      right: -7vmax;
      top: 8vh;
      background: radial-gradient(circle at 36% 34%, #dff8ff, #52d2ff 36%, rgba(82, 210, 255, 0) 72%);
      animation-delay: -5s;
      transform: translateZ(80px);
    }

    .orb.three {
      width: 42vmax;
      height: 42vmax;
      left: 31vw;
      bottom: -20vmax;
      background: radial-gradient(circle at 44% 35%, #eee2ff, #8a5cff 41%, rgba(138, 92, 255, 0) 73%);
      animation-delay: -9s;
      transform: translateZ(-60px);
    }

    .orb.four {
      width: 18vmax;
      height: 18vmax;
      right: 21vw;
      bottom: 14vh;
      background: radial-gradient(circle at 40% 35%, #fff7ca, #ffbd4a 42%, rgba(255, 189, 74, 0) 74%);
      filter: blur(22px);
      opacity: 0.46;
      animation-delay: -2s;
      transform: translateZ(180px);
    }

    .message {
      position: relative;
      z-index: 2;
      padding: clamp(24px, 5vw, 56px) clamp(28px, 7vw, 82px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(22px) saturate(150%);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 112px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 14px 45px rgba(0, 0, 0, 0.4);
    }

    @keyframes drift {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(18deg) scale(1.12);
      }
    }

    @keyframes float {
      from {
        translate: -2vw -2vh;
      }

      to {
        translate: 3vw 4vh;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="orb four"></div>
  </div>
  <main class="message">
    <h1>Привет, Антон</h1>
  </main>
</body>
</html>
